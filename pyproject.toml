[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jev-arbiter-study"
version = "0.1.0"
description = "A clean experiment testing model crowds, heterogeneous voting, and JEV Delphi arbitration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.4,<2", "httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp -p no:cacheprovider"

[tool.hatch.build.targets.wheel]
packages = ["arbiter_study", "followup_study"]
